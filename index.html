<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Little Prince — Book Trailer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
  body{display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);container-type:size;background:#000;pointer-events:none;user-select:none;overflow:hidden}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
  #vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.45) 100%)}
  .bar{position:absolute;left:0;right:0;height:8cqh;background:#000}
  #bt{top:0;border-bottom:1px solid rgba(214,176,92,.35)}
  #bb{bottom:0;border-top:1px solid rgba(214,176,92,.35)}
  #stage.end .bar{border-color:transparent !important}
  .t{position:absolute;left:0;right:0;text-align:center;opacity:0;color:#fbeed0;white-space:nowrap;
     font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-weight:600;
     text-shadow:0 .25cqw 1.2cqw rgba(0,0,0,.8)}
  #cap{bottom:0;height:8cqh;line-height:8cqh;font-size:2.5cqw;letter-spacing:.1em;color:#f6e6c0;text-shadow:none}
  .ly{position:absolute;opacity:0;white-space:nowrap;font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;font-style:italic;font-weight:500;
      font-size:2.3cqw;letter-spacing:.14em;color:#f4e3b8;text-shadow:0 0 1.6cqw rgba(255,214,120,.5),0 .15cqw .5cqw rgba(0,0,0,.85),0 0 1.2cqw rgba(40,20,10,.7)}
  #title{top:13cqw;font-family:'Cinzel',Georgia,'Times New Roman',serif;font-weight:600;
         font-size:5.6cqw;letter-spacing:.18em;color:#f7dc92;text-shadow:0 0 2cqw rgba(255,200,90,.5),0 .3cqw 1.2cqw #000}
  #sub{top:22.5cqw;font-size:2.4cqw;letter-spacing:.12em}
  #by0{top:30.2cqw;font-family:'Cinzel',Georgia,serif;font-weight:400;font-size:1.3cqw;letter-spacing:.24em;color:#e9d7ad}
  #credit{top:50%;transform:translateY(-50%);font-family:'Cinzel',Georgia,'Times New Roman',serif;
          font-weight:400;font-size:3.4cqw;letter-spacing:.26em;color:#f3e2b3;text-shadow:0 0 2cqw rgba(255,200,90,.35)}
  #frm{position:absolute;inset:11cqh 4cqw;border:1px solid rgba(232,200,120,.5);opacity:0}
  #frm::before,#frm::after{content:"✦";position:absolute;color:#e8c878;font-size:1.6cqw;line-height:1}
  #frm::before{left:-.8cqw;top:-.8cqw;background:#0b1636}#frm::after{right:-.8cqw;bottom:-.8cqw;background:#0b1636}
  #orn{top:25.9cqw;display:flex;justify-content:center;align-items:center;gap:1.4cqw;color:#e8c878;font-size:1.6cqw}
  #orn i{display:block;width:13cqw;height:1px;background:linear-gradient(90deg,transparent,#e8c878)}
  #orn i+b+i{background:linear-gradient(90deg,#e8c878,transparent)}
  #orn b{font-weight:400}
  #credit::before{content:"✦";display:block;font-size:1.8cqw;margin-bottom:1.6cqw;color:#c9a64e;letter-spacing:0}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="vig"></div>
  <div class="bar" id="bt"></div>
  <div class="bar" id="bb"></div>
  <div id="lyrics"></div>
  <div class="t" id="cap"></div>
  <div class="t" id="title">THE LITTLE PRINCE</div>
  <div class="t" id="sub">A story for everyone who was once a child.</div>
  <div id="frm"></div>
  <div class="t" id="orn"><i></i><b>✦</b><i></i></div>
  <div class="t" id="by0">BASED ON THE NOVELLA BY ANTOINE DE SAINT-EXUPÉRY</div>
  <div class="t" id="credit">By: ANAM BILAL</div>
</div>

<script>
(() => {
const W = 320, H = 180;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const main = cv.getContext('2d');
let g = main;

/* ---------- tiny pixel toolkit ---------- */
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const build = fn => { const c = mk(), old = g; g = c.getContext('2d'); fn(); g = old; return c; };
let seed = 11;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); };
const P = (x, y, c) => R(x, y, 1, 1, c);
const A = (a, fn) => { g.globalAlpha = Math.max(0, Math.min(1, a)); fn(); g.globalAlpha = 1; };
const clamp01 = v => Math.max(0, Math.min(1, v));
const disc = (cx, cy, r, c) => { g.fillStyle = c; for (let y = -r; y <= r; y++) { const w = Math.floor(Math.sqrt(r * r - y * y) + .5); g.fillRect(Math.round(cx) - w, Math.round(cy) + y, w * 2 + 1, 1); } };
const ell = (cx, cy, rx, ry, c) => { g.fillStyle = c; for (let y = -ry; y <= ry; y++) { const w = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry + .01))) + .5); g.fillRect(Math.round(cx) - w, Math.round(cy) + y, w * 2 + 1, 1); } };
const hexRGB = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
const grad = (stops, n) => Array.from({ length: n }, (_, k) => {
  const p = k / (n - 1) * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(p)), f = p - i, a = hexRGB(stops[i]), b = hexRGB(stops[i + 1]);
  return '#' + a.map((v, j) => Math.round(v + (b[j] - v) * f).toString(16).padStart(2, '0')).join('');
});
// clean banded gradient: hard bands with a thin checker seam between them
const sky = (pal, y0 = 0, y1 = H) => {
  const n = pal.length - 1;
  for (let y = y0; y < y1; y++) {
    const t = (y - y0) / (y1 - y0) * n, i = Math.min(n - 1, Math.floor(t)), f = t - i;
    for (let x = 0; x < W; x++) { let c = pal[i]; if (f > .8) c = ((x + y) & 1) ? pal[i + 1] : pal[i]; if (f > .93) c = pal[i + 1]; P(x, y, c); }
  }
};
const shadedDisc = (cx, cy, r, pal, L = [-.55, -.5, .67]) => {
  const n = pal.length - 1;
  for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) {
    if (Math.hypot(x, y) > r + .2) continue;
    const nx = x / r, ny = y / r, nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));
    let l = nx * L[0] + ny * L[1] + nz * L[2]; l = clamp01(l * .9 + .1);
    const t = l * n, i = Math.min(n - 1, Math.floor(t)), f = t - i;
    let c = pal[i]; if (f > .8) c = ((cx + x + cy + y) & 1) ? pal[i + 1] : pal[i]; if (f > .92) c = pal[i + 1];
    P(cx + x, cy + y, c);
  }
};
const sprite = (rows, x, y, pal) => { for (let j = 0; j < rows.length; j++) for (let i = 0; i < rows[j].length; i++) { const ch = rows[j][i]; if (ch !== '.') P(x + i, y + j, pal[ch]); } };
const dy = (b, a, f, p, x) => Math.round(b + Math.sin(x * f + p) * a + Math.sin(x * f * 2.3 + p * 1.7) * a * .35);

/* ---------- stars, dust, birds ---------- */
const STARS = Array.from({ length: 170 }, () => ({ x: rnd() * W, y: rnd() * H, z: rnd() < .2 ? 2 : 1, ph: rnd() * 6.28, sp: .6 + rnd() * 2, c: ['#ffffff', '#ffe9a8', '#bcd7ff'][rnd() * 3 | 0], d: .3 + rnd() }));
const drawStars = (t, ymax, a, drift) => {
  for (const s of STARS) {
    if (s.y > ymax) continue;
    const tw = .55 + .45 * Math.sin(t * s.sp + s.ph), x = ((s.x - t * drift * s.d) % W + W) % W;
    A(a * tw, () => { P(x, s.y, s.c); if (s.z === 2) { P(x - 1, s.y, s.c); P(x + 1, s.y, s.c); P(x, s.y - 1, s.c); P(x, s.y + 1, s.c); } });
  }
};
const DUST = Array.from({ length: 40 }, () => ({ x: rnd() * W, y: rnd() * H, vx: 2 + rnd() * 4, vy: 3 + rnd() * 6, ph: rnd() * 6.28 }));
const drawDust = (t, a) => { for (const p of DUST) { const x = (p.x + t * p.vx) % W, y = ((p.y - t * p.vy) % H + H) % H; A(a * (.25 + .75 * Math.pow(Math.sin(t * 2 + p.ph), 2)), () => P(x, y, '#ffe9a0')); } };
const bigStar = (x, y, t, c = '#fff6c8') => {
  const k = 2 + Math.round(1.5 + 1.5 * Math.sin(t * 2));
  A(.15, () => disc(x, y, 6, c));
  for (let i = -k; i <= k; i++) A(1 - Math.abs(i) / (k + 1), () => { P(x + i, y, c); P(x, y + i, c); });
  A(.5, () => { P(x - 1, y - 1, c); P(x + 1, y - 1, c); P(x - 1, y + 1, c); P(x + 1, y + 1, c); });
};
const shoot = (p, x0, y0, len = 16, dx = -130, dyy = 62) => {
  if (p < 0 || p > 1) return;
  const hx = x0 + p * dx, hy = y0 + p * dyy, k = Math.abs(dyy / dx), env = 1 - Math.abs(p - .5) * 1.6;
  for (let i = 0; i < len; i++) A((1 - i / len) * env, () => P(hx - Math.sign(dx) * i, hy - Math.sign(dyy) * i * k, '#ffffff'));
};
const bird = (x, y, t, c) => { if (Math.sin(t * 9) > 0) { P(x - 2, y - 1, c); P(x - 1, y, c); P(x, y, c); P(x + 1, y, c); P(x + 2, y - 1, c); } else { P(x - 2, y + 1, c); P(x - 1, y, c); P(x, y, c); P(x + 1, y, c); P(x + 2, y + 1, c); } };
const cloud = (x, y, s, c) => { ell(x, y, 10 * s, 3 * s, c); ell(x + 6 * s, y - 2 * s, 7 * s, 3 * s, c); ell(x - 6 * s, y - 1 * s, 6 * s, 2 * s, c); };

/* ---------- characters ---------- */
const PP = { o: '#2b2238', y: '#f6c84a', Y: '#ffe69a', h: '#c9962a', f: '#fbdcbc', F: '#e8b48e', k: '#2b2238', c: '#f0a08e', s: '#ffd84d', S: '#e0a82a', g: '#3f9b64', G: '#2a6f4a', l: '#74d094', b: '#8a5530', B: '#5a3320' };
const PRINCE = [
  "....ooooooo....",
  "..ooyYYYyyyoo..",
  ".oyYYyyyyyyyyo.",
  "oyyYyyyyyyyhyyo",
  "oyyyyyyyyyyyhyo",
  ".oyyyffffffyyo.",
  ".oyyfffffffffyo",
  ".oyffkfffkffyo.",
  ".oyffkfffkffyo.",
  ".oyfcffffffcfyo",
  "..oofffffffoo..",
  "...ooofffooo...",
  ".ossssssssssso.",
  "ooSsssssssssSoo",
  "oglggggggggggGo",
  "oglggggggggggGo",
  "ogllgggggggggGo",
  "ofgGggggggggGfo",
  "offogggggggoffo",
  ".oobbbbbbbbboo.",
  ".ogggggggggggo.",
  ".oggggGoGggggo.",
  ".oggggGoGggggo.",
  ".oggggo.oggggo.",
  ".obbbbo.obbbbo.",
  ".oBBBBo.oBBBBo."
];
const prince = (cx, fy, t) => {
  const y0 = fy - 26;
  ell(cx, fy, 9, 1, 'rgba(0,0,0,.28)');
  for (let i = 0; i < 22; i++) {
    const yy = y0 + 12 + Math.round(Math.sin(t * 4.5 - i * .45) * (.6 + i * .2) - i * .05);
    R(cx + 7 + i, yy, 1, 2, i % 5 < 3 ? '#ffd84d' : '#f2c036'); R(cx + 7 + i, yy + 2, 1, 1, '#c9922a');
  }
  sprite(PRINCE, cx - 7, y0, PP);
  const w = Math.round(Math.sin(t * 4)); P(cx + 7 + w, y0 + 3, '#f6c84a'); P(cx + 8 + w, y0 + 2, '#ffe69a');
};
const ROSE = [".rRRRr.", "rRRrRRr", "rRrRrRr", "rrrrrrr", ".rrrrr.", "..rrr.."];
const rose = (x, by, t) => {
  R(x, by - 8, 1, 8, '#3d8f48'); R(x - 3, by - 5, 3, 1, '#5cb35a'); P(x - 4, by - 6, '#5cb35a'); R(x + 1, by - 3, 3, 1, '#5cb35a'); P(x + 4, by - 4, '#5cb35a');
  sprite(ROSE, x - 3, by - 14, { r: '#c8324f', R: '#ef6f86' });
  for (let a = 0; a <= Math.PI; a += .09) A(.55, () => P(x + 9 * Math.cos(a), by - 1 - 15 * Math.sin(a), '#d8f3ff'));
  A(.55, () => R(x - 9, by - 1, 19, 1, '#d8f3ff'));
  A(.95, () => { P(x - 6, by - 11, '#ffffff'); P(x - 6, by - 10, '#ffffff'); P(x - 5, by - 13, '#ffffff'); });
  const pt = (t * .25) % 1; A(Math.sin(pt * Math.PI) * .9, () => P(x - 1 + Math.sin(pt * 9) * 3, by - 6 + pt * 5, '#ef6f86'));
};
const volcano = (x, by, t) => {
  for (let j = 0; j < 10; j++) { const w = 3 + j; R(x - w, by - 10 + j, w * 2 + 1, 1, '#6b4331'); P(x - w, by - 10 + j, '#b07a56'); P(x - w + 1, by - 10 + j, '#8a5a44'); }
  R(x - 2, by - 11, 5, 1, Math.sin(t * 8) > 0 ? '#ff9a3c' : '#ff6a2a');
  for (let k = 0; k < 4; k++) { const ph = (t * .35 + k * .25) % 1; A((1 - ph) * .6, () => disc(x + Math.sin(ph * 6 + k) * 3 + ph * 7, by - 13 - ph * 26, Math.round(1 + ph * 3), '#e2dcd8')); }
};
const sprout = (x, by) => { R(x, by - 6, 1, 6, '#3b7a3a'); R(x - 2, by - 6, 2, 1, '#5cb35a'); R(x + 1, by - 7, 2, 1, '#5cb35a'); P(x, by - 7, '#7fcf6a'); };
const fox = (x, fy, d, t) => {
  const O = '#e8782a', Dk = '#a24d1d', Wt = '#fff3df', K = '#2a1810', Z = 1.35;
  const z = v => Math.round(v * Z), X = dx => x + z(dx) * d;
  const E = (dx, dyy, rx, ry, c) => ell(X(dx), fy + z(dyy), z(rx), z(ry), c);
  const RX = (dx, dyy, w, h, c) => R(d > 0 ? x + z(dx) : x - z(dx) - z(w) + 1, fy + z(dyy), z(w), z(h), c);
  ell(x, fy, 15, 1, 'rgba(0,0,0,.28)');
  const w = Math.sin(t * 2.6) * 2;
  E(-10, -4 + w * .4, 8, 3, O); E(-17, -5 + w, 3, 2, Wt); E(-9, -5 + w * .4, 5, 1, Dk);
  E(0, -8, 6, 8, O); E(-2, -4, 3, 3, Dk); E(3, -7, 3, 6, Wt);
  RX(2, -3, 2, 3, K); RX(5, -3, 2, 3, K);
  E(4, -17, 5, 4, O); RX(7, -16, 4, 2, Wt); RX(10, -17, 1, 1, K); RX(5, -18, 1, 1, K);
  RX(2, -24, 2, 3, O); RX(3, -25, 1, 1, O); RX(6, -24, 2, 3, O); RX(7, -25, 1, 1, O); RX(3, -23, 1, 1, Dk); RX(7, -23, 1, 1, Dk);
};
const HEART = [".rr.rr.", "rrrrrrr", "rrrrrrr", ".rrrrr.", "..rrr..", "...r..."];
const plane = (x, y) => {
  const o = i => Math.round((23 - i) * .22);
  for (let i = 0; i < 24; i++) { R(x + i, y + o(i), 1, 5, i < 3 ? '#b9bcc8' : i > 19 ? '#7e2a26' : '#9c3b32'); P(x + i, y + o(i), '#d97a66'); }
  for (let i = 4; i < 20; i++) { R(x + i, y + o(i) - 7, 1, 2, '#d8b45c'); R(x + i, y + o(i) + 7, 1, 2, '#b8944a'); }
  R(x + 8, y + o(8) - 5, 1, 12, '#5b4a30'); R(x + 16, y + o(16) - 5, 1, 12, '#5b4a30');
  R(x + 22, y + o(22) - 5, 2, 5, '#7e2a26'); R(x - 2, y + o(0) - 3, 1, 10, '#3a3a44');
};
const fire = (x, y, t) => {
  A(.1 + .03 * Math.sin(t * 9), () => disc(x, y - 4, 30, '#ff9a3c')); A(.14, () => disc(x, y - 4, 18, '#ffc46a'));
  R(x - 5, y - 1, 11, 2, '#4a2c1a'); R(x - 4, y - 2, 9, 1, '#6a3e22');
  for (let i = 0; i < 5; i++) { const h = 7 + Math.round(Math.sin(t * 11 + i * 1.7) * 2.5 + 2.5), fx = x - 4 + i * 2; R(fx, y - 2 - h, 2, h, i % 2 ? '#ffb23c' : '#ff7a1f'); R(fx, y - 2 - h * .55, 1, Math.round(h * .5), '#ffe38a'); }
  for (let k = 0; k < 6; k++) { const ph = (t * .6 + k * .17) % 1; A(1 - ph, () => P(x + Math.sin(ph * 7 + k * 2) * 5, y - 10 - ph * 26, '#ffd27a')); }
};
const pilot = (x, fy) => {
  const c = '#191424';
  R(x, fy - 10, 9, 10, c); R(x - 1, fy - 3, 3, 3, c); disc(x + 4, fy - 14, 3, c); R(x + 1, fy - 18, 7, 2, '#2a2030'); R(x + 6, fy - 17, 3, 1, '#2a2030');
  R(x + 8, fy - 10, 1, 9, '#d8803c'); R(x + 7, fy - 15, 1, 3, '#d8803c'); R(x + 9, fy - 5, 3, 4, c);
  ell(x + 4, fy, 9, 1, 'rgba(0,0,0,.25)');
};
const cactus = (x, fy) => { const c = '#1c3040', l = '#35566a'; R(x, fy - 18, 4, 18, c); R(x - 5, fy - 12, 3, 2, c); R(x - 5, fy - 16, 2, 5, c); R(x + 6, fy - 9, 3, 2, c); R(x + 8, fy - 14, 2, 6, c); R(x + 3, fy - 17, 1, 15, l); };

/* ---------- planets ---------- */
const GREENS = ['#16302a', '#22503a', '#2f7040', '#43924a', '#62b455', '#8ad46a', '#b6ec88'];
const mkPlanet = r => {
  const S = r * 2 + 4, c = document.createElement('canvas'); c.width = c.height = S; const old = g; g = c.getContext('2d');
  const m = r + 2;
  disc(m, m, r + 1, '#10241d');
  shadedDisc(m, m, r, GREENS);
  for (let a = -1.35; a <= 1.35; a += .16) {
    const x = Math.round(m + Math.sin(a) * r), y = Math.round(m - Math.cos(a) * r);
    R(x, y - 2, 1, 3, '#9fe070'); P(x + 1, y - 1, '#6fb44f'); P(x - 1, y - 1, '#6fb44f');
    if (rnd() < .35) { P(x, y - 3, rnd() < .5 ? '#ff9ab0' : '#fff3c0'); }
  }
  for (let i = 0; i < r * 1.2; i++) {
    const a = rnd() * 6.283, d = r * (.15 + .75 * Math.sqrt(rnd())), x = Math.round(m + Math.cos(a) * d), y = Math.round(m + Math.sin(a) * d);
    if (Math.hypot(x - m, y - m) < r - 2) { P(x, y, x < m ? '#a6e27a' : '#1c4430'); P(x + 1, y, x < m ? '#8ad46a' : '#1c4430'); }
  }
  g = old; return c;
};
const PL22 = mkPlanet(22), PL26 = mkPlanet(26), PL46 = mkPlanet(46), PL30 = mkPlanet(30);

/* ---------- backgrounds (baked once) ---------- */
const milky = () => { for (let i = 0; i < 520; i++) { const x = rnd() * W, yc = 150 - x * .4, y = yc + (rnd() + rnd() + rnd() - 1.5) * 28; A(.18 + rnd() * .3, () => P(x, y, rnd() < .5 ? '#9fb4ff' : '#e6ecff')); } };
const nebula = (cx, cy, c, n) => { for (let i = 0; i < n; i++) { const x = cx + (rnd() + rnd() + rnd() - 1.5) * 50, y = cy + (rnd() + rnd() + rnd() - 1.5) * 24; A(.1 + rnd() * .18, () => R(x, y, 2, 1, c)); } };
const bgA = build(() => { sky(grad(['#05070f', '#0a1235', '#142a62', '#2a4f8e'], 9)); nebula(70, 50, '#3fa6b8', 260); nebula(250, 120, '#d46a8a', 240); nebula(150, 90, '#6a7ad8', 200); milky(); });
const moonC = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 32; const q = c.getContext('2d');
  for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) {
    const a = Math.hypot(x - 16, y - 16) <= 13, b = Math.hypot(x - 21, y - 12) <= 11;
    if (a && !b) { q.fillStyle = Math.hypot(x - 16, y - 16) > 11.5 ? '#fff7dc' : '#f3e2b4'; q.fillRect(x, y, 1, 1); }
  }
  return c;
})();
